# Robô de coleta: de hora em hora pergunta à API se há busca devida (sem coleta nas
# últimas 20 horas, ou pedida pela tela). Só instala o navegador quando há trabalho.
name: Coleta do swipe

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: coletor
    env:
      COLETOR_KEY: ${{ secrets.COLETOR_KEY }}
      COLETOR_DIAG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checar buscas devidas
        id: checar
        run: node coletar.mjs --checar
      - name: Instalar o Chromium
        if: steps.checar.outputs.devidas != '0'
        run: npm ci && npx playwright install --with-deps chromium
      - name: Coletar
        if: steps.checar.outputs.devidas != '0'
        run: node coletar.mjs
